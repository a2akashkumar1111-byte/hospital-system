{% extends "base.html" %}
{% block content %}
<h2>Doctors</h2>
<form method="POST" class="card p-3 mb-4">
  <div class="row">
    <div class="col"><input name="name" class="form-control" placeholder="Doctor Name" required></div>
    <div class="col"><select name="spec" class="form-control"><option>Cardiologist</option><option>Neurologist</option><option>General</option><option>Dentist</option></select></div>
    <div class="col"><input name="phone" class="form-control" placeholder="Phone" required></div>
    <div class="col"><button class="btn btn-success w-100">Add Doctor</button></div>
  </div>
</form>
<table class="table table-bordered">
  <tr><th>ID</th><th>Name</th><th>Specialization</th><th>Phone</th></tr>
  {% for d in doctors %}
  <tr><td>{{d['id']}}</td><td>{{d['name']}}</td><td>{{d['specialization']}}</td><td>{{d['phone']}}</td></tr>
  {% endfor %}
</table>
{% endblock %}
